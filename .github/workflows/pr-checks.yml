name: PR checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  questions:
    name: Questions and app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # every company, so the duplicate check sees the whole bank
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - name: App starts and grades
        run: python3 tools/smoke.py
      - name: Changed questions (format, references, 4 language drivers, known-wrong solutions, duplicates)
        run: python3 tools/add_question.py --changed "origin/${{ github.base_ref || 'main' }}"
      - name: data/catalog.json is up to date
        run: python3 tools/build_catalog.py --check || { echo "::error::Run python3 tools/build_catalog.py and commit data/catalog.json"; exit 1; }
      - name: No unsettled duplicates in the bank
        run: python3 tools/check_dupes.py
      - name: Function specs still verify (when tools/style changed)
        run: |
          if git diff --name-only "origin/${{ github.base_ref || 'main' }}" -- tools/style | grep -q .; then
            python3 tools/style/verify.py && python3 tools/style/selftest.py
          else
            echo "tools/style unchanged"
          fi
