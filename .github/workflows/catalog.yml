name: Catalog
# data/catalog.json lists every company for the home page. It's rebuilt here after questions land on main,
# so pull requests don't need to touch it (and don't conflict over it).
on:
  push:
    branches: [main]
    paths: ["data/**", "tools/build_catalog.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: catalog
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python3 tools/build_catalog.py
      - name: Commit if it changed
        run: |
          if git diff --quiet -- data/catalog.json; then echo "catalog up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update data/catalog.json" -- data/catalog.json
          git push
